name: Publish documentation

on:
  push:
    branches:
      - devel-2.0
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    env:
      BLEND_DOC_VERSIONS: '[["devel-2.0","https://cascadiaquakes.github.io/blend/"],["2.0.0","https://cascadiaquakes.github.io/blend/2.0.0/"]]'
    steps:
      - name: Checkout BLEND development source
        uses: actions/checkout@v6
        with:
          ref: devel-2.0

      - name: Checkout BLEND 2.0.0 source
        uses: actions/checkout@v6
        with:
          repository: cascadiaquakes/blend
          ref: v2.0.0
          path: _versions/blend-2.0.0

      - name: Add version selector support to BLEND 2.0.0
        run: |
          cp doc/rst/source/conf.py _versions/blend-2.0.0/doc/rst/source/conf.py
          cp doc/rst/source/_static/blend.js _versions/blend-2.0.0/doc/rst/source/_static/blend.js

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: doc/rst/requirements.txt

      - name: Install Python documentation dependencies
        run: python -m pip install -r doc/rst/requirements.txt

      - name: Install PDF documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-latex-recommended

      - name: Configure development documentation
        run: |
          cmake -S . -B build-devel \
            -DBLEND_BUILD_DOCS=ON \
            -DBLEND_BUILD_EXAMPLES=OFF \
            -DBLEND_BUILD_TESTS=OFF \
            -DSPHINX_BUILD_EXECUTABLE="$(command -v sphinx-build)"

      - name: Build development documentation
        env:
          BLEND_DOC_CURRENT_VERSION: devel-2.0
          BLEND_DOC_GITHUB_VERSION: devel-2.0
        run: cmake --build build-devel --target docs

      - name: Configure 2.0.0 documentation
        run: |
          cmake -S _versions/blend-2.0.0 -B build-2.0.0 \
            -DBLEND_BUILD_DOCS=ON \
            -DBLEND_BUILD_EXAMPLES=OFF \
            -DBLEND_BUILD_TESTS=OFF \
            -DSPHINX_BUILD_EXECUTABLE="$(command -v sphinx-build)"

      - name: Build 2.0.0 documentation
        env:
          BLEND_DOC_CURRENT_VERSION: 2.0.0
          BLEND_DOC_GITHUB_VERSION: v2.0.0
        run: cmake --build build-2.0.0 --target docs

      - name: Assemble documentation site
        run: |
          cmake -E make_directory build/site
          cmake -E copy_directory build-devel/doc/html build/site
          cmake -E make_directory build/site/2.0.0
          cmake -E copy_directory build-2.0.0/doc/html build/site/2.0.0

      - name: Check documentation links
        run: python .github/scripts/check_docs_links.py build/site

      - name: Disable Jekyll processing
        run: touch build/site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy:
    name: Deploy documentation
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
